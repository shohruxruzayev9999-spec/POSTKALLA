# Runs next to the old ERP on the same host: own Postgres, API on 127.0.0.1:8090 only.
# Host nginx (already on the server) terminates TLS and serves the web build.
name: postkalla
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=25", "-c", "work_mem=4MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      retries: 20
  api:
    image: postkalla-api:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8090:8080"]
    environment:
      DATABASE_URL: postgres://erp:${DB_PASSWORD}@db:5432/erp
      BOT_TOKEN: ${BOT_TOKEN:?}
      JWT_SECRET: ${JWT_SECRET:?}
      WEBAPP_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      NODE_ENV: production
      # Optional: enables AI summaries and the daily AI digest.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Telegram ids that confirm subscription payments (comma-separated).
      PLATFORM_ADMIN_TG_IDS: ${PLATFORM_ADMIN_TG_IDS:-}
      # Keep the heap inside the container limit so a big PDF fails one request, not the host.
      NODE_OPTIONS: --max-old-space-size=224
    mem_limit: 350m
    memswap_limit: 450m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment: { PGPASSWORD: "${DB_PASSWORD}" }
    volumes: ["./backups:/backups", "./backup.sh:/backup.sh:ro"]
    entrypoint: ["sh", "/backup.sh"]
    mem_limit: 64m
volumes:
  pgdata:
